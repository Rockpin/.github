name: travel-report

# 매일 09:00 KST(00:00 UTC) 실행
# - 월요일: 이번 주 추천 여행지 + 오늘의 환율 (weekly)
# - 그 외 : 오늘의 환율만 갱신 (daily)
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto(월요일=weekly) / daily / weekly"
        type: choice
        options: [auto, daily, weekly]
        default: auto

permissions:
  contents: write

concurrency:
  group: travel-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "httpx>=0.27,<1"

      - name: Generate profile README
        run: python scripts/report.py --mode "${{ github.event.inputs.mode || 'auto' }}"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898296+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 여행 리포트 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
            git push
          fi
